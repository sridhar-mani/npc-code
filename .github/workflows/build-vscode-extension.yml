name: Build VS Code Extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/vscode-ui/**"
      - "packages/core/**"
      - "packages/agent/**"
      - "packages/ai/**"
      - "packages/tui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-vscode-extension.yml"
      - ".vscode/extensions/test-extension/**"

permissions:
  contents: read

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            fd-find \
            ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck Pi VS Code extension
        run: npm run typecheck --workspace=ziq-vscode-ui

      - name: Build Pi VS Code extension
        run: npm run build --workspace=ziq-vscode-ui

      - name: Verify extension bundle before packaging
        shell: bash
        run: |
          set -euo pipefail
          test -s packages/vscode-ui/dist/extension.js
          grep -q 'pi.openChat' packages/vscode-ui/dist/extension.js
          grep -q 'pi.addCustomModel' packages/vscode-ui/dist/extension.js
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('packages/vscode-ui/package.json', 'utf8'));
          if (p.main !== './dist/extension') throw new Error('Unexpected extension main: ' + p.main);
          const welcome = JSON.stringify(p.contributes?.viewsWelcome ?? []);
          if (!welcome.includes('command:pi.openChat')) throw new Error('Pi welcome must invoke pi.openChat');
          if (!welcome.includes('command:pi.addCustomModel')) throw new Error('Pi welcome must invoke pi.addCustomModel');
          if (welcome.includes('command:copilot.addCustomModel')) throw new Error('Stale Copilot custom-model command remains in Pi welcome');
          if (welcome.includes('command:workbench.action.chat.open')) throw new Error('Pi welcome must use the Pi chat command');
          NODE

      - name: Package VSIX
        run: cd packages/vscode-ui && npx --no-install @vscode/vsce package

      - name: Verify VSIX
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/vscode-ui/*.vsix)
          test "${#files[@]}" -eq 1
          unzip -l "${files[0]}" | grep -E "extension/package.json"
          unzip -l "${files[0]}" | grep -E "extension/dist/extension.js"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ziq-vscode-ui-linux-${{ github.run_number }}
          path: packages/vscode-ui/*.vsix
          if-no-files-found: error
          retention-days: 14
