name: Build VS Code Extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/vscode/**"
      - "packages/core/**"
      - "packages/agent/**"
      - "packages/ai/**"
      - "packages/tui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-vscode-extension.yml"

permissions:
  contents: read

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            fd-find \
            ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      # The repository lockfile currently contains stale optional esbuild entries.
      # npm install reconciles the workspace manifests before building; once the
      # lockfile is regenerated, this can safely return to npm ci.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck NPC VS Code extension
        run: npm run typecheck --workspace=npc-vscode

      - name: Test NPC VS Code extension contract
        run: npm test --workspace=npc-vscode

      - name: Build NPC VS Code extension
        run: npm run build --workspace=npc-vscode

      - name: Verify extension bundle before packaging
        shell: bash
        run: |
          set -euo pipefail
          test -s packages/vscode/dist/extension.js
          test -s packages/vscode/dist/terminal-client.cjs
          grep -q 'pi.openChat' packages/vscode/dist/extension.js
          grep -q 'pi.addCustomModel' packages/vscode/dist/extension.js
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('packages/vscode/package.json', 'utf8'));
          const commands = new Set((p.contributes?.commands ?? []).map((c) => c.command));
          for (const id of ['pi.openChat', 'pi.addCustomModel']) {
            if (!commands.has(id)) throw new Error('Missing contributed command: ' + id);
            if (!(p.activationEvents ?? []).includes('onCommand:' + id)) {
              throw new Error('Missing explicit activation event: onCommand:' + id);
            }
          }
          if (p.main !== './dist/extension.js') throw new Error('Unexpected extension main: ' + p.main);
          const container = (p.contributes?.viewsContainers?.activitybar ?? []).find((entry) => entry.id === 'pi-assistant-container');
          if (!container) throw new Error('Missing NPC Activity Bar container');
          if (container.icon !== 'assets/logo.png') throw new Error('Unexpected NPC Activity Bar icon: ' + container.icon);
          if (!fs.existsSync('packages/vscode/assets/logo.png')) throw new Error('Missing packaged NPC Activity Bar icon asset');
          NODE

      - name: Package VSIX
        run: cd packages/vscode && npx --no-install @vscode/vsce package --no-dependencies --allow-missing-repository --allow-star-activation

      - name: Verify VSIX
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/vscode/*.vsix)
          test "${#files[@]}" -eq 1
          unzip -l "${files[0]}" | grep -E "extension/package.json"
          unzip -l "${files[0]}" | grep -E "extension/dist/extension.js"
          unzip -l "${files[0]}" | grep -E "extension/dist/terminal-client.cjs"
          unzip -l "${files[0]}" | grep -E "extension/assets/logo.png"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: npc-vscode-linux-${{ github.run_number }}
          path: packages/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
