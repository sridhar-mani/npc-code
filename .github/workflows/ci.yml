name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Generate current terminal-ui shrinkwrap
        run: npm run shrinkwrap:coding-agent

      - name: Upload generated shrinkwrap
        uses: actions/upload-artifact@v4
        with:
          name: generated-terminal-ui-shrinkwrap
          path: packages/terminal-ui/npm-shrinkwrap.json
          if-no-files-found: error

      - name: Commit generated shrinkwrap
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/resume-model-fallback'
        run: |
          if git diff --quiet -- packages/terminal-ui/npm-shrinkwrap.json; then
            echo "Shrinkwrap already matches generated output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/terminal-ui/npm-shrinkwrap.json
          git commit -m "chore: refresh terminal-ui shrinkwrap"
          git push origin HEAD:${{ github.head_ref }}
      - name: Generate current terminal-ui install lock
        run: npm run install-lock:coding-agent

      - name: Commit generated install lock
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/resume-model-fallback'
        run: |
          if git diff --quiet -- packages/terminal-ui/install-lock; then
            echo "Install lock already matches generated output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/terminal-ui/install-lock
          git commit -m "chore: refresh terminal-ui install lock"
          git push origin HEAD:${{ github.head_ref }}
      - name: Check
        run: npm run check

      - name: Test
        run: npm test
