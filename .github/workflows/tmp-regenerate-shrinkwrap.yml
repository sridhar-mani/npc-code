name: Temporary shrinkwrap regeneration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Regenerate shrinkwrap
        run: npm run shrinkwrap:coding-agent

      - name: Commit generated shrinkwrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/terminal-ui/npm-shrinkwrap.json
          if git diff --cached --quiet; then
            echo "Shrinkwrap is already current."
            exit 0
          fi
          git commit -m "chore: regenerate terminal-ui shrinkwrap"
          git push origin HEAD:${GITHUB_HEAD_REF}
