name: Temporary generated-lock regeneration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Regenerate generated install artifacts
        run: |
          npm run shrinkwrap:coding-agent
          npm run install-lock:coding-agent

      - name: Commit generated install lock through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="packages/terminal-ui/install-lock/package-lock.json"
          if git diff --quiet -- "$file"; then
            echo "Generated install lock is already current."
            exit 0
          fi
          repo="$GITHUB_REPOSITORY"
          branch="$GITHUB_HEAD_REF"
          content="$(base64 -w0 "$file")"
          sha="$(gh api "repos/$repo/contents/$file?ref=$branch" --jq '.sha')"
          gh api --method PUT "repos/$repo/contents/$file"             -f message="chore: regenerate terminal-ui install lock"             -f branch="$branch"             -f sha="$sha"             -f content="$content"
