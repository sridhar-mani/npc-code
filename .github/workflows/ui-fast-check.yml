name: Temporary VS Code UI Fast Check

on:
  push:
    branches: [main]
    paths:
      - "packages/vscode-ui/src/sidebar/**"
      - "packages/vscode-ui/src/extension.ts"
      - "packages/vscode-ui/src/backend-bridge.ts"
      - "packages/vscode-ui/test/extension-contract.test.mjs"
      - "packages/vscode-ui/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-fast-check.yml"

permissions:
  contents: read

jobs:
  vscode-ui-fast-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Contract tests
        run: npm test --workspace=ziq-vscode-ui

      - name: Build
        run: npm run build --workspace=ziq-vscode-ui
